<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quiz Tower Defense</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:"Sarabun","Noto Sans Thai",Tahoma,system-ui,sans-serif}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;min-height:46px;color:#fff;background:#3b82f6;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .08s}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
button:disabled{opacity:.45;cursor:not-allowed}
button.green{background:#22a559}button.red{background:#e0453a}button.gray{background:#586577}button.gold{background:#e5a50a;color:#222}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:none;flex-direction:column}
.screen.active{display:flex}
/* ---------- เมนู ---------- */
#menu,#levels{align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;overflow:auto;
 background:radial-gradient(circle at 30% 20%,#2e7d4f 0,#1b3a4b 45%,#241a4d 100%)}
.title{font-size:clamp(2rem,8vw,3.6rem);margin:0;font-weight:900;text-shadow:0 4px 0 #0006,0 0 24px #ffd54f88;letter-spacing:1px}
.sub{opacity:.85;margin:0}
.menu-btns{display:flex;flex-direction:column;gap:12px;width:min(320px,90%)}
.menu-btns button{font-size:1.2rem;min-height:56px}
.progress{background:#0005;border-radius:14px;padding:10px 18px;font-weight:700}
.lvl-wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%}
.lvl{width:min(250px,92%);border-radius:18px;padding:16px;text-align:center;color:#fff;box-shadow:0 6px 0 #0005;position:relative}
.lvl h3{margin:6px 0}.lvl p{margin:4px 0;font-size:.92rem}
.lvl.l0{background:linear-gradient(160deg,#3fa34d,#1f6b34)}
.lvl.l1{background:linear-gradient(160deg,#f0a22e,#c2571a)}
.lvl.l2{background:linear-gradient(160deg,#3c4bd6,#7b2fbf)}
.lvl.locked{filter:grayscale(.85) brightness(.7)}
.lvl .big{font-size:2.4rem}
/* ---------- เกม ---------- */
#game{background:#101820}
#topbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:6px 10px;background:#0b1118;font-weight:700;font-size:clamp(.8rem,3.2vw,1.05rem)}
#topbar span{white-space:nowrap}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#0006}
#cv{width:100%;height:100%;object-fit:contain;touch-action:none;display:block}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#000b;padding:8px 16px;border-radius:20px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .25s;max-width:92%;text-align:center;font-size:.95rem}
#toast.show{opacity:1}
#bottom{background:#0b1118;padding:6px 8px;display:flex;flex-direction:column;gap:6px}
#actions{display:flex;gap:6px;flex-wrap:wrap}
#actions button{flex:1;min-width:92px;padding:8px 6px;font-size:clamp(.82rem,3.4vw,1rem)}
#invrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:42px}
.chip{background:#26364a;border:2px solid #3b5575;border-radius:12px;padding:4px 10px;min-height:40px;font-size:1rem;box-shadow:none}
.chip.sel{border-color:#ffd54f;background:#5a4a12}
#hint{font-size:.85rem;opacity:.9;min-height:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#hint button{min-height:34px;padding:4px 12px;font-size:.85rem}
/* ---------- หน้าต่างป๊อปอัป ---------- */
.modal{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.modal.hidden{display:none}
.panel{background:#1b2735;border:3px solid #3b5575;border-radius:20px;padding:18px;width:min(560px,100%);max-height:94%;overflow:auto;box-shadow:0 10px 40px #000a}
.panel h2{margin:0 0 10px;text-align:center}
.panel p{margin:6px 0;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:#2c4263;box-shadow:0 3px 0 #0006}
.opt.ok{background:#1f9d55}.opt.bad{background:#d23b3b}
.tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.8rem;font-weight:700;background:#3b82f6;margin-right:6px}
.tag.bonus{background:#e5a50a;color:#222}
.exp{background:#0004;border-radius:10px;padding:8px 12px;margin-top:8px}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{flex:1;min-width:140px;background:#26364a;border:2px solid #3b5575;border-radius:16px;padding:12px;text-align:center}
.card .em{font-size:2.6rem}.card h4{margin:4px 0}.card p{margin:3px 0;font-size:.85rem}
.price{font-weight:900;color:#ffd54f}
.rot{display:none;font-size:.75rem;opacity:.8;text-align:center}
@media (orientation:portrait) and (max-width:700px){.rot{display:block}}

/* ---------- ตกแต่งเมนู ---------- */
:root{color-scheme:dark}
#menu{background:linear-gradient(180deg,#42b4f0 0%,#a9e3ff 50%,#86d35a 50.1%,#3c9a3a 100%)}
#menu>*:not(.deco){position:relative;z-index:2}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sun{position:absolute;top:5%;right:8%;width:76px;height:76px;border-radius:50%;background:radial-gradient(#fffbd0,#ffd54f);box-shadow:0 0 44px #ffe082}
.cloud{position:absolute;left:0;height:34px;width:110px;background:#fff;border-radius:50px;opacity:.92;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50px;height:50px;top:-24px;left:14px}.cloud::after{width:38px;height:38px;top:-16px;left:58px}
.c1{top:9%;animation-duration:62s}.c2{top:22%;animation-duration:88s;animation-delay:-35s}.c3{top:34%;animation-duration:74s;animation-delay:-52s}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 160px))}}
#parade{position:absolute;left:0;right:0;bottom:0;height:96px}
#parade img{position:absolute;bottom:4px;left:-90px;animation:march linear infinite}
@keyframes march{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 180px))}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.logo{font-size:clamp(3rem,13vw,5rem);filter:drop-shadow(0 6px 0 #0004)}
.title span{display:inline-block;-webkit-text-stroke:2px #14344a;paint-order:stroke fill;text-shadow:0 5px 0 #0005}
.t1{color:#ffeb3b}.t2{color:#fff}.t3{color:#ff7043}
#menu .sub{color:#0d3b57;font-weight:800;opacity:1}
.heroes{display:flex;gap:0;justify-content:center;flex-wrap:wrap;max-width:100%}
.heroes img{animation:bob 1.2s ease-in-out infinite}
.chip{display:inline-flex;align-items:center;gap:4px}
.card .em img{display:block;margin:0 auto}
.lvl .big img{display:block;margin:0 auto}
@media (prefers-reduced-motion:reduce){.cloud,#parade img,.bob,.heroes img{animation:none}}
.credit{margin:6px 0 0;padding:6px 16px;border-radius:14px;background:rgba(10,30,45,.55);color:#fff;font-weight:800;font-size:clamp(.9rem,3.6vw,1.05rem);text-shadow:0 2px 0 #0006}
</style>

<div id="app">

  <!-- หน้าหลัก -->
  <section id="menu" class="screen active">
    <div class="deco"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div id="parade"></div></div>
    <div class="logo bob">🏰</div>
    <h1 class="title"><span class="t1">Quiz</span> <span class="t2">Tower</span> <span class="t3">Defense</span></h1>
    <p class="sub">ตอบคำถาม สะสมคะแนน ซื้อตัวละคร ป้องกันฐาน!</p>
    <div class="heroes" id="heroes"></div>
    <div class="progress" id="progressBox"></div>
    <div class="menu-btns">
      <button class="green" id="btnContinue" style="display:none">▶ เล่นต่อ</button>
      <button class="green" id="btnStart">🎮 เริ่มเกม</button>
      <button id="btnHow">📖 วิธีการเล่น</button>
      <button class="gray" id="btnSound">🔊 ตั้งค่าเสียง</button>
    </div>
    <p class="credit">จัดทำโดย นางสาว ปาลิตา วงษา</p>
  </section>

  <!-- เลือกด่าน -->
  <section id="levels" class="screen">
    <h1 class="title" style="font-size:clamp(1.6rem,6vw,2.6rem)">เลือกด่าน</h1>
    <div class="lvl-wrap" id="lvlWrap"></div>
    <button class="gray" id="btnLvlBack">⬅ กลับหน้าหลัก</button>
  </section>

  <!-- หน้าเล่น -->
  <section id="game" class="screen">
    <div id="topbar">
      <span id="hudScore">⭐ 0</span>
      <span id="hudBase">❤️ 100</span>
      <span id="hudLevel">ด่าน</span>
      <span id="hudWave">รอบ 1/10</span>
    </div>
    <div id="stage">
      <canvas id="cv" width="800" height="500"></canvas>
      <div id="toast"></div>
    </div>
    <div id="bottom">
      <div class="rot">💡 หมุนโทรศัพท์เป็นแนวนอนจะเล่นง่ายขึ้น</div>
      <div id="actions">
        <button class="gold" id="btnQuiz">❓ ตอบคำถาม</button>
        <button id="btnShop">🛒 ร้านค้า</button>
        <button class="green" id="btnWave">▶ เริ่มรอบ</button>
        <button class="gray" id="btnSpeed">⏩ x1</button>
        <button class="gray" id="btnPause">☰</button>
      </div>
      <div id="invrow"></div>
      <div id="hint"></div>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="panel" id="panel"></div></div>
</div>

<script>

const SAVE_KEY = 'quiz_td_save_v1';
let S = { unlocked:[true,false,false], cleared:[false,false,false], session:null, sound:true };
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ const d = JSON.parse(raw); S = Object.assign(S, d); }
  }catch(e){}
  S.unlocked[0] = true;
}
function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- 3) เสียง (WebAudio) ---------- */
let AC = null, lastAtk = 0;
function audioInit(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = null; }
}
function tone(f, d, type, vol, delay){
  if(!S.sound || !AC) return;
  try{
    const t = AC.currentTime + (delay||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'square'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol||0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}

const $ = id => document.getElementById(id);
let G = null;              // สถานะเกมที่กำลังเล่น
let modalOpen = false;
let bgCanvas = null;       // พื้นหลังที่วาดไว้ล่วงหน้า
let pathInfo = null;       // ข้อมูลความยาวเส้นทาง
let ghost = null;          // ตำแหน่งตัวอย่างขณะวาง

function rnd(a,b){ return a + Math.random()*(b-a); }
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx, ay-by); }

function buildPath(pts){
  const segs = []; let total = 0;
  for(let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1], len = dist(a[0],a[1],b[0],b[1]);
    segs.push({a, b, len, start: total}); total += len;
  }
  return { pts, segs, total };
}
function posAt(s){
  const P = pathInfo;
  if(s <= 0) return { x:P.pts[0][0], y:P.pts[0][1] };
  for(const sg of P.segs){
    if(s <= sg.start + sg.len){
      const t = (s - sg.start) / sg.len;
      return { x: sg.a[0] + (sg.b[0]-sg.a[0])*t, y: sg.a[1] + (sg.b[1]-sg.a[1])*t };
    }
  }
  const e = P.pts[P.pts.length-1]; return { x:e[0], y:e[1] };
}
function pathDist(x,y){
  let best = 1e9;
  for(const sg of pathInfo.segs){
    const ax=sg.a[0], ay=sg.a[1], bx=sg.b[0], by=sg.b[1];
    const dx=bx-ax, dy=by-ay;
    let t = ((x-ax)*dx + (y-ay)*dy) / (dx*dx+dy*dy);
    t = Math.max(0, Math.min(1, t));
    best = Math.min(best, dist(x,y, ax+dx*t, ay+dy*t));
  }
  return best;
}

// จำนวนบอท / พลังชีวิต ตามตารางและสูตรในสเปก
function enemyCount(l, w){ const L = LEVELS[l]; return L.cnt0 + (w-1)*L.cntStep; }
function baseEnemyHp(l, w){
  const L = LEVELS[l];
  const v = L.baseHp * Math.pow(1 + L.rate, w - 1);
  return Math.ceil(Math.round(v*1e6)/1e6);   // ปัดขึ้น (กันค่าทศนิยมคลาดเคลื่อน)
}
function planWave(l, w){
  const n = enemyCount(l, w), list = [];
  const pf = [ w>=4?0.2:0,  w>=2?0.25:0, 0.3 ][l];
  const pa = [ w>=7?0.15:0, w>=3?0.2:0,  0.22 ][l];
  for(let i=0;i<n;i++){
    const r = Math.random();
    list.push(r < pf ? 'fast' : r < pf+pa ? 'armor' : 'normal');
  }
  if(w === 10) list[0] = 'boss';
  return shuffle(list).sort((a,b)=> (a==='boss'?1:0)-(b==='boss'?1:0)); // บอสมาท้ายสุด
}

function newGame(level, session){
  const L = LEVELS[level];
  pathInfo = buildPath(L.path);
  buildBackground(level);
  G = {
    level, wave: session ? session.wave : 1, phase:'prep',
    score: session ? session.score : START_SCORE,
    baseHp: session ? session.baseHp : 100,
    towers: session ? session.towers.map(t=>({type:t.type,x:t.x,y:t.y,cd:0})) : [],
    inv: session ? session.inv.slice() : [],
    shop: session && session.shop ? session.shop.slice() : rollShop(),
    enemies: [], queue: [], spawnT: 0, fx: [],
    placing: null, selected: null, speed: 1, usedQ: new Set(), bossFlash: 0
  };
  ghost = null;
  document.body.style.setProperty('--theme', L.theme);
  go('game'); renderAll();
  if(!session){ saveSession(); toast('ซื้อตัวละครแล้ววางบนสนาม จากนั้นกด "เริ่มรอบ"'); }
  else toast('เล่นต่อจากรอบที่ '+G.wave);
}
function rollShop(){ return shuffle(TOWER_KEYS).slice(0,3); }
function saveSession(){
  if(!G) return;
  S.session = { level:G.level, wave:G.wave, score:G.score, baseHp:G.baseHp,
    towers:G.towers.map(t=>({type:t.type,x:t.x,y:t.y})), inv:G.inv.slice(), shop:G.shop.slice() };
  writeSave();
}

function startWave(){
  if(!G || G.phase!=='prep') return;
  G.queue = planWave(G.level, G.wave);
  G.spawnT = 0.3; G.phase = 'wave';
  G.placing = null; ghost = null;
  renderAll(); toast('รอบที่ '+G.wave+' เริ่มแล้ว! บอท '+G.queue.length+' ตัว');
}
function spawnEnemy(type){
  const T = ENEMY[type], L = LEVELS[G.level];
  const hp = Math.ceil(Math.round(baseEnemyHp(G.level, G.wave) * T.hp * 1e6)/1e6);
  const p = posAt(0);
  G.enemies.push({ type, hp, maxHp:hp, s:0, x:p.x, y:p.y, spd:L.speed*T.spd, slow:0, flash:0, dead:false });
}

function hitEnemy(e, dmg){
  if(e.dead) return;
  e.hp -= dmg; e.flash = 0.1;
  if(e.hp <= 0){
    e.dead = true;
    G.fx.push({k:'ring', x:e.x, y:e.y, r:8, max:ENEMY[e.type].r+14, c:'#fff', t:.3, m:.3});
  }
}
function inRange(t, range){
  const R = TOWERS[t.type].range;
  return G.enemies.filter(e => !e.dead && dist(t.x,t.y,e.x,e.y) <= (range||R) + ENEMY[e.type].r*0.5);
}
function towerAttack(t){
  const D = TOWERS[t.type];
  const list = inRange(t).sort((a,b)=>b.s-a.s);
  if(!list.length) return false;
  const tg = list[0];
  if(D.chain){
    const hits = list.slice(0, D.chain);
    let px = t.x, py = t.y;
    hits.forEach(e => { G.fx.push({k:'line', x1:px, y1:py, x2:e.x, y2:e.y, c:D.color, w:3, t:.15, m:.15, zig:true}); hitEnemy(e, D.dmg); px=e.x; py=e.y; });
  } else if(D.splash){
    G.fx.push({k:'line', x1:t.x, y1:t.y, x2:tg.x, y2:tg.y, c:'#ffcc80', w:4, t:.12, m:.12});
    G.fx.push({k:'ring', x:tg.x, y:tg.y, r:6, max:D.splash, c:'#ff9800', t:.3, m:.3});
    G.enemies.forEach(e => { if(!e.dead && dist(tg.x,tg.y,e.x,e.y) <= D.splash) hitEnemy(e, D.dmg); });
  } else if(D.slow){
    G.fx.push({k:'line', x1:t.x, y1:t.y, x2:tg.x, y2:tg.y, c:D.color, w:4, t:.15, m:.15});
    G.fx.push({k:'ring', x:tg.x, y:tg.y, r:6, max:45, c:'#81d4fa', t:.3, m:.3});
    hitEnemy(tg, D.dmg);
    G.enemies.forEach(e => { if(!e.dead && dist(tg.x,tg.y,e.x,e.y) <= 45) e.slow = D.slow; });
  } else if(t.type==='sword'){
    G.fx.push({k:'ring', x:tg.x, y:tg.y, r:4, max:24, c:'#ffcdd2', t:.18, m:.18});
    hitEnemy(tg, D.dmg);
  } else {
    G.fx.push({k:'line', x1:t.x, y1:t.y, x2:tg.x, y2:tg.y, c:D.color, w:t.type==='fire'?5:2, t:.12, m:.12});
    if(t.type==='fire') G.fx.push({k:'ring', x:tg.x, y:tg.y, r:4, max:22, c:'#ff7043', t:.2, m:.2});
    hitEnemy(tg, D.dmg);
  }
  SFX.attack();
  return true;
}

function update(dt){
  if(!G || G.phase==='over') return;
  // เกิดบอท
  if(G.phase==='wave' && G.queue.length){
    G.spawnT -= dt;
    if(G.spawnT <= 0){
      spawnEnemy(G.queue.shift());
      G.spawnT = LEVELS[G.level].spawn;
    }
  }
  // บอทเดิน
  for(const e of G.enemies){
    if(e.dead) continue;
    const k = e.slow>0 ? 0.5 : 1;
    if(e.slow>0) e.slow -= dt;
    if(e.flash>0) e.flash -= dt;
    e.s += e.spd * k * dt;
    if(e.s >= pathInfo.total){
      e.dead = true; e.reached = true;
      G.baseHp = Math.max(0, G.baseHp - ENEMY[e.type].dmg);
      G.bossFlash = 0.4; SFX.hit();
      const b = posAt(pathInfo.total);
      G.fx.push({k:'ring', x:b.x, y:b.y, r:10, max:50, c:'#ff1744', t:.4, m:.4});
    } else { const p = posAt(e.s); e.x = p.x; e.y = p.y; }
  }
  // ตัวละครโจมตี
  for(const t of G.towers){
    t.cd -= dt;
    if(t.cd <= 0){ if(towerAttack(t)) t.cd = TOWERS[t.type].cd; else t.cd = 0; }
  }
  G.enemies = G.enemies.filter(e => !e.dead);
  for(const f of G.fx) f.t -= dt;
  G.fx = G.fx.filter(f => f.t > 0);
  if(G.bossFlash>0) G.bossFlash -= dt;

  if(G.baseHp <= 0){ gameOver(); return; }
  if(G.phase==='wave' && !G.queue.length && !G.enemies.length) waveClear();
}

function waveClear(){
  const w = G.wave;
  G.phase = 'prep';
  if(w >= 10){ levelClear(); return; }
  G.wave++;
  G.shop = rollShop();       // สุ่มร้านค้าใหม่ทุกรอบ
  saveSession(); renderAll(); SFX.win();
  openModal(`<h2>🎉 ผ่านรอบที่ ${w}!</h2>
    <p style="text-align:center">กำจัดบอทครบทุกตัวแล้ว ร้านค้าสุ่มตัวละครชุดใหม่ให้คุณแล้ว</p>
    <p style="text-align:center">เตรียมตัวให้พร้อม แล้วกด "เริ่มรอบ" เมื่อต้องการสู้รอบที่ ${G.wave}</p>
    <div class="row"><button class="gold" id="mQuiz">❓ ตอบคำถาม</button><button id="mShop">🛒 ร้านค้า</button><button class="green" id="mOk">ตกลง</button></div>`,
    ()=>{ $('mOk').onclick=closeModal; $('mQuiz').onclick=showQuiz; $('mShop').onclick=showShop; });
}
function levelClear(){
  const l = G.level;
  S.cleared[l] = true;
  if(l < 2) S.unlocked[l+1] = true;
  S.session = null; writeSave();
  G.phase = 'over'; SFX.win();
  const last = l === 2;
  openModal(last
    ? `<h2>🏆 ชนะเกมทั้งหมด!</h2><p style="text-align:center">คุณป้องกันฐานได้ครบทั้ง 3 ด่าน 30 รอบ ยอดเยี่ยมมาก!</p>
       <div class="row"><button id="mLv">เลือกด่าน</button><button class="gray" id="mMenu">หน้าหลัก</button></div>`
    : `<h2>⭐ ผ่านด่านที่ ${l+1}!</h2><p style="text-align:center">ปลดล็อก "${LEVELS[l+1].name}" แล้ว</p>
       <div class="row"><button class="green" id="mNext">ไปด่านถัดไป</button><button id="mLv">เลือกด่าน</button><button class="gray" id="mMenu">หน้าหลัก</button></div>`,
    ()=>{
      $('mLv').onclick = ()=>{ closeModal(); showLevels(); };
      $('mMenu').onclick = ()=>{ closeModal(); showMenu(); };
      if($('mNext')) $('mNext').onclick = ()=>{ closeModal(); newGame(l+1); };
    });
}
function gameOver(){
  G.phase = 'over'; S.session = null; writeSave(); SFX.lose();
  const l = G.level, w = G.wave;
  openModal(`<h2>💀 Game Over</h2><p style="text-align:center">ฐานถูกทำลายในรอบที่ ${w}/10 ของด่าน "${LEVELS[l].name}"</p>
    <div class="row"><button class="green" id="mRe">🔄 เริ่มเล่นใหม่</button><button class="gray" id="mMenu">หน้าหลัก</button></div>`,
    ()=>{ $('mRe').onclick=()=>{ closeModal(); newGame(l); }; $('mMenu').onclick=()=>{ closeModal(); showMenu(); }; });
}

/* ---------- 5) วาดภาพ ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function buildBackground(level){
  const L = LEVELS[level];
  bgCanvas = document.createElement('canvas'); bgCanvas.width = W; bgCanvas.height = H;
  const c = bgCanvas.getContext('2d'), rng = mulberry(level*977+13);
  c.fillStyle = L.ground; c.fillRect(0,0,W,H);
  // ลวดลายพื้น
  if(level === 2){
    c.strokeStyle = '#3a38a0'; c.lineWidth = 1; c.globalAlpha = .5;
    for(let x=0;x<=W;x+=40){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
    for(let y=0;y<=H;y+=40){ c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
    c.globalAlpha = 1;
  } else {
    c.fillStyle = L.ground2;
    for(let i=0;i<90;i++){ c.beginPath(); c.arc(rng()*W, rng()*H, 6+rng()*18, 0, 7); c.fill(); }
  }
  // เส้นทาง
  c.lineCap = 'round'; c.lineJoin = 'round';
  const trace = () => { c.beginPath(); L.path.forEach((p,i)=> i? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1])); };
  c.strokeStyle = L.edge; c.lineWidth = 50; trace(); c.stroke();
  c.strokeStyle = L.road; c.lineWidth = 40; trace(); c.stroke();
  if(level === 2){ c.strokeStyle = '#9fb0ff'; c.lineWidth = 2; c.setLineDash([12,14]); trace(); c.stroke(); c.setLineDash([]); }
  // ของตกแต่ง
  c.textAlign = 'center'; c.textBaseline = 'middle';
  let placed = 0, tries = 0;
  const pi = buildPath(L.path); const keep = pathInfo; pathInfo = pi;
  while(placed < 38 && tries < 600){
    tries++;
    const x = 18 + rng()*(W-36), y = 18 + rng()*(H-36);
    if(pathDist(x,y) < 44) continue;
    c.font = (16+rng()*14)+'px serif';
    c.fillText(L.decor[Math.floor(rng()*L.decor.length)], x, y);
    placed++;
  }
  pathInfo = keep;
  // ฐาน
  const b = L.path[L.path.length-1];
  c.beginPath(); c.arc(b[0], b[1], 32, 0, 7); c.fillStyle = '#00000055'; c.fill();
  c.font = '44px serif'; c.fillText('🏰', b[0], b[1]);
  // จุดเกิด
  const s = L.path[0];
  c.font = '22px serif'; c.fillText('🚪', Math.max(s[0],14), s[1]);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(!G || !bgCanvas){ requestAnimationFrame(draw); return; }
  ctx.drawImage(bgCanvas, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // วงระยะของตัวละครที่เลือก
  if(G.selected){
    const t = G.selected, R = TOWERS[t.type].range;
    ctx.beginPath(); ctx.arc(t.x,t.y,R,0,7); ctx.fillStyle='rgba(255,255,255,.15)'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  }
  // ตัวละคร
  for(const t of G.towers){
    const D = TOWERS[t.type];
    ctx.beginPath(); ctx.arc(t.x, t.y+2, 17, 0, 7); ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fill();
    ctx.beginPath(); ctx.arc(t.x, t.y, 16, 0, 7); ctx.fillStyle = D.color; ctx.fill();
    ctx.lineWidth = G.selected===t ? 4 : 2; ctx.strokeStyle = G.selected===t ? '#ffd54f' : '#fff'; ctx.stroke();
    drawSpr(t.type, t.x, t.y-7, 44);
  }
  // บอท (เรียงตามแกน y)
  const es = G.enemies.slice().sort((a,b)=>a.y-b.y);
  for(const e of es){
    const T = ENEMY[e.type];
    ctx.beginPath(); ctx.arc(e.x, e.y+3, T.r, 0, 7); ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fill();
    if(e.slow>0){ ctx.beginPath(); ctx.arc(e.x, e.y, T.r+4, 0, 7); ctx.fillStyle='rgba(129,212,251,.55)'; ctx.fill(); }
    drawSpr('e_'+e.type, e.x, e.y-2, T.r*2.7);
    if(e.flash>0){ ctx.globalAlpha=.55; ctx.beginPath(); ctx.arc(e.x, e.y, T.r, 0, 7); ctx.fillStyle='#fff'; ctx.fill(); ctx.globalAlpha=1; }
    const bw = T.r*2+4, bx = e.x-bw/2, by = e.y-T.r*1.35-8;
    ctx.fillStyle='#000a'; ctx.fillRect(bx,by,bw,5);
    ctx.fillStyle = e.hp/e.maxHp>.5 ? '#4caf50' : e.hp/e.maxHp>.25 ? '#ffc107' : '#f44336';
    ctx.fillRect(bx,by,bw*Math.max(0,e.hp/e.maxHp),5);
  }
  // เอฟเฟกต์
  for(const f of G.fx){
    const a = Math.max(0, f.t/f.m);
    ctx.globalAlpha = a;
    if(f.k==='line'){
      ctx.strokeStyle=f.c; ctx.lineWidth=f.w; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(f.x1,f.y1);
      if(f.zig){ const mx=(f.x1+f.x2)/2+rnd(-10,10), my=(f.y1+f.y2)/2+rnd(-10,10); ctx.lineTo(mx,my); }
      ctx.lineTo(f.x2,f.y2); ctx.stroke();
    } else if(f.k==='ring'){
      const r = f.r + (f.max-f.r)*(1-a);
      ctx.strokeStyle=f.c; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(f.x,f.y,r,0,7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // ตัวอย่างตำแหน่งวาง
  if(G.placing && ghost){
    const D = TOWERS[G.placing], ok = canPlace(ghost.x, ghost.y).ok;
    ctx.beginPath(); ctx.arc(ghost.x,ghost.y,D.range,0,7);
    ctx.fillStyle = ok?'rgba(80,255,120,.18)':'rgba(255,60,60,.18)'; ctx.fill();
    ctx.strokeStyle = ok?'#69f0ae':'#ff5252'; ctx.lineWidth=2; ctx.stroke();
    ctx.globalAlpha=.85; ctx.beginPath(); ctx.arc(ghost.x,ghost.y,16,0,7); ctx.fillStyle=D.color; ctx.fill();
    drawSpr(G.placing, ghost.x, ghost.y-7, 44); ctx.globalAlpha=1;
  }
  if(G.bossFlash>0){ ctx.fillStyle='rgba(255,0,0,'+(G.bossFlash*.35)+')'; ctx.fillRect(0,0,W,H); }
  requestAnimationFrame(draw);
}

}

  $('hudScore').textContent = '⭐ '+G.score;

/* --- ระบบคำถาม --- */
function pickQuestion(){
  const pool = QUIZ[G.level];
  let avail = pool.map((_,i)=>i).filter(i=>!G.usedQ.has(i));
  if(!avail.length){ G.usedQ.clear(); avail = pool.map((_,i)=>i); }
  const i = avail[Math.floor(Math.random()*avail.length)];
  G.usedQ.add(i);
  const q = pool[i];
  const opts = shuffle(q.o.map((t,idx)=>({t, ok:idx===0})));
  return { q:q.q, e:q.e, opts, bonus: Math.random() < 0.2 };
}
function showQuiz(){
  audioInit();
  const Q = pickQuestion(), pts = Q.bonus ? 20 : 10;
  const lv = ['ง่าย','ปานกลาง','ยาก'][G.level];
  openModal(`<h2>❓ ตอบคำถาม</h2>
    <p><span class="tag">ระดับ${lv}</span>${Q.bonus?'<span class="tag bonus">⭐ โบนัสพิเศษ +20</span>':'<span class="tag" style="background:#586577">ตอบถูก +10</span>'}
    <span style="float:right">⭐ ${G.score}</span></p>
    <p style="font-size:1.15rem;font-weight:700">${Q.q}</p>
    <div id="opts"></div><div id="qres"></div>
    <div class="row"><button class="gray" id="qClose">ปิด</button></div>`,
    ()=>{
      const box = $('opts'); let done = false;
      $('qClose').onclick = closeModal;
      Q.opts.forEach((o,i)=>{
        const b = document.createElement('button');
        b.className = 'opt'; b.textContent = ['ก','ข','ค','ง'][i]+'. '+o.t;
        b.onclick = ()=>{
          if(done) return; done = true;
          [...box.children].forEach((c,j)=>{ c.disabled = true; c.style.opacity = 1; if(Q.opts[j].ok) c.classList.add('ok'); });
          if(o.ok){
            G.score += pts; b.classList.add('ok'); SFX.correct();
            $('qres').innerHTML = `<p style="color:#7CFFA8;font-weight:800">✅ ถูกต้อง! ได้รับ +${pts} คะแนน</p><div class="exp">💡 ${Q.e}</div>`;
          } else {
            b.classList.add('bad'); SFX.wrong();
            $('qres').innerHTML = `<p style="color:#ff8a80;font-weight:800">❌ ผิด! ไม่ได้รับคะแนน</p><div class="exp">💡 ${Q.e}</div>`;
          }
          $('qClose').insertAdjacentHTML('beforebegin', '<button class="gold" id="qNext">➡ คำถามถัดไป</button>');
          $('qNext').onclick = showQuiz;
          saveSession(); renderHUD();
        };
        box.appendChild(b);
      });
    });
}

/* --- ร้านค้า --- */
function showShop(){
  audioInit();
  const full = G.towers.length + G.inv.length >= MAX_TOWERS;
  let html = `<h2>🛒 ร้านค้าตัวละคร</h2><p style="text-align:center">⭐ คะแนนของคุณ: <b>${G.score}</b> · ตัวละคร ${G.towers.length+G.inv.length}/${MAX_TOWERS}</p><div class="cards">`;
  G.shop.forEach((k,i)=>{
    const D = TOWERS[k], can = G.score >= D.price && !full;
    html += `<div class="card"><div class="em">${spriteTag(k,76,'bob')}</div><h4>${D.name}</h4><p>${D.desc}</p>
      <p>💥 ความเสียหาย ${D.dmg} · 🎯 ระยะ ${D.range}</p><p class="price">⭐ ${D.price}</p>
      <button class="${can?'green':'gray'}" data-i="${i}" ${can?'':'disabled'}>ซื้อ</button></div>`;
  });
  html += `</div><p style="text-align:center;font-size:.85rem;opacity:.8">${full?'ตัวละครเต็มจำนวนแล้ว — ขายตัวเก่าก่อนจึงจะซื้อเพิ่มได้':'ร้านค้าจะสุ่มชุดใหม่เมื่อขึ้นรอบใหม่ · เก็บคะแนนไว้ซื้อรอบถัดไปได้'}</p>
    <div class="row"><button class="gold" id="sQuiz">❓ ตอบคำถามหาคะแนน</button><button class="gray" id="sClose">ปิด</button></div>`;
  openModal(html, ()=>{
    $('sClose').onclick = closeModal;
    $('sQuiz').onclick = showQuiz;
    document.querySelectorAll('#panel .card button').forEach(b=>{
      b.onclick = ()=>{
        const k = G.shop[+b.dataset.i], D = TOWERS[k];
        if(G.score < D.price || G.towers.length+G.inv.length >= MAX_TOWERS) return;
        G.score -= D.price; G.inv.push(k); SFX.buy(); saveSession();
        showShop(); toast('ซื้อ '+D.name+' แล้ว! กดที่ตัวละครด้านล่างแล้ววางบนสนาม');
      };
    });
  });
}

    <p>2. กด <b>🛒 ร้านค้า</b> ซื้อตัวละครที่สุ่มมา 3 ตัว (สุ่มใหม่ทุกรอบ)</p>
    <p>3. แตะตัวละครในแถบ "ตัวละครที่มี" แล้วแตะบนสนามเพื่อวาง (วางทับกันหรือบนเส้นทางไม่ได้ สูงสุด ${MAX_TOWERS} ตัว)</p>
    <p>4. กด <b>▶ เริ่มรอบ</b> บอทจะเดินตามเส้นทางไปยังฐาน ตัวละครจะโจมตีเองอัตโนมัติ</p>
    <p>5. ถ้าบอทเดินถึงฐาน ฐานจะเสียพลังชีวิต เหลือ 0 = แพ้ ผ่านครบ 10 รอบ = ผ่านด่าน</p>
    <p>6. แตะตัวละครที่วางแล้วเพื่อดูระยะ หรือขายคืนครึ่งราคา</p>
    <p><b>ตัวละคร:</b> ยิงเร็ว · แรง · ระเบิดวงกว้าง · ทำให้ช้า · ระยะใกล้ · ฟาดหลายตัว</p>
    <p style="text-align:center">${TOWER_KEYS.map(k=>spriteTag(k,40)).join(' ')}</p>
    <p><b>บอท:</b> ธรรมดา · ความเร็วสูง · เกราะหนา · บอส (รอบที่ 10)</p>
    <p style="text-align:center">${['e_normal','e_fast','e_armor','e_boss'].map(k=>spriteTag(k,46)).join(' ')}</p>
    <p>เริ่มแต่ละด่านด้วย ⭐ ${START_SCORE} คะแนน</p>
    <div class="row"><button class="green" id="hOk">เข้าใจแล้ว</button></div>`, ()=>{ $('hOk').onclick=closeModal; });
}
function showSettings(){
  openModal(`<h2>⚙️ ตั้งค่า</h2>
    <div class="row"><button id="sSound">${S.sound?'🔊 เสียง: เปิด':'🔇 เสียง: ปิด'}</button></div>
    <div class="row"><button class="red" id="sReset">🗑️ ล้างความคืบหน้าทั้งหมด</button></div>
    <div class="row"><button class="gray" id="sOk">ปิด</button></div>`,
    ()=>{
      $('sSound').onclick = ()=>{ audioInit(); S.sound=!S.sound; writeSave(); SFX.click(); showSettings(); refreshSoundBtns(); };
      let armed = false;
      $('sReset').onclick = ()=>{
        if(!armed){ armed = true; $('sReset').textContent = '⚠️ กดอีกครั้งเพื่อยืนยันการล้าง'; return; }
        S = { unlocked:[true,false,false], cleared:[false,false,false], session:null, sound:S.sound };
        writeSave(); closeModal(); G = null; showMenu();
      };

    });
}
function refreshSoundBtns(){ $('btnSound').textContent = S.sound ? '🔊 เสียง: เปิด' : '🔇 เสียง: ปิด'; }

/* ---------- 7) การควบคุม ---------- */
function canPlace(x, y){
  if(x<16||y<16||x>W-16||y>H-16) return {ok:false, why:'วางนอกสนามไม่ได้'};
  if(pathDist(x,y) < 34) return {ok:false, why:'วางบนเส้นทางของบอทไม่ได้'};
  const b = pathInfo.pts[pathInfo.pts.length-1];
  if(dist(x,y,b[0],b[1]) < 50) return {ok:false, why:'ใกล้ฐานเกินไป'};
  for(const t of G.towers) if(dist(x,y,t.x,t.y) < 36) return {ok:false, why:'วางทับตัวละครอื่นไม่ได้'};
  return {ok:true};
}
function evPos(e){
  const r = cv.getBoundingClientRect();
  const sc = Math.min(r.width/W, r.height/H);
  const ox = (r.width - W*sc)/2, oy = (r.height - H*sc)/2;
  return { x:(e.clientX - r.left - ox)/sc, y:(e.clientY - r.top - oy)/sc };
}
cv.addEventListener('pointerdown', e=>{
  if(!G || modalOpen || G.phase==='over') return;
  audioInit();
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const p = evPos(e);
  if(G.placing){ ghost = p; return; }
  let found = null, best = 24;
  for(const t of G.towers){ const d = dist(p.x,p.y,t.x,t.y); if(d < best){ best = d; found = t; } }
  G.selected = found; renderHint();
});
cv.addEventListener('pointermove', e=>{
  if(!G || !G.placing) return;
  if(e.pointerType==='mouse' || e.buttons) ghost = evPos(e);
});
cv.addEventListener('pointerup', e=>{
  if(!G || !G.placing || !ghost || modalOpen) return;
  const p = evPos(e); ghost = p;
  const r = canPlace(p.x, p.y);
  if(!r.ok){ toast('⚠️ '+r.why); return; }
  const k = G.placing;
  const idx = G.inv.indexOf(k); if(idx<0){ G.placing=null; renderAll(); return; }
  G.inv.splice(idx,1);
  G.towers.push({type:k, x:p.x, y:p.y, cd:0.2});
  SFX.place();
  G.fx.push({k:'ring', x:p.x, y:p.y, r:6, max:30, c:'#fff', t:.3, m:.3});
  if(!G.inv.includes(k)) { G.placing = null; ghost = null; }
  saveSession(); renderAll();
});

$('btnStart').onclick = ()=>{ audioInit(); SFX.click(); showLevels(); };
$('btnContinue').onclick = ()=>{ audioInit(); SFX.click(); if(S.session) newGame(S.session.level, S.session); };

$('btnSound').onclick = ()=>{ audioInit(); S.sound = !S.sound; writeSave(); SFX.click(); refreshSoundBtns(); };
$('btnLvlBack').onclick = ()=>{ SFX.click(); showMenu(); };

$('btnShop').onclick = ()=>{ if(G && G.phase!=='over') showShop(); };
$('btnWave').onclick = ()=>{ audioInit(); startWave(); };
$('btnSpeed').onclick = ()=>{ if(!G) return; G.speed = G.speed===1 ? 2 : G.speed===2 ? 3 : 1; renderAll(); };
$('btnPause').onclick = ()=>{
  if(!G || G.phase==='over') return;
  openModal(`<h2>⏸ หยุดเกม</h2><div class="row"><button class="green" id="pBack">▶ เล่นต่อ</button>
    <button id="pSet">⚙️ ตั้งค่าเสียง</button><button class="red" id="pMenu">🏠 ออกไปหน้าหลัก</button></div>
    <p style="text-align:center;font-size:.85rem;opacity:.8">ความคืบหน้าถูกบันทึกอัตโนมัติ (รอบที่กำลังสู้จะเริ่มใหม่เมื่อเล่นต่อ)</p>`,
    ()=>{
      $('pBack').onclick = closeModal;
      $('pSet').onclick = showSettings;
      $('pMenu').onclick = ()=>{ saveSession(); closeModal(); G = null; showMenu(); };
    });
};

// ลูปเกม
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
  if(G && !modalOpen && $('game').classList.contains('active')){
    const n = G.speed;
    for(let i=0;i<n;i++) update(dt);
    renderHUD();
  }
  requestAnimationFrame(loop);
}

// เริ่มต้น
loadSave(); buildMenuDeco(); showMenu();
requestAnimationFrame(loop);
requestAnimationFrame(draw);
</script>
